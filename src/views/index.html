<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <title>ESPEChat</title>
  </head>
  <body>
    <header>
      <h1>ESPEChat</h1>
      <button id="logout-btn" class="btn logout" type="button">Cerrar sesión</button>
    </header>
    <main>
      <div id="chat-user-count"></div>
      <div id="all-messages"></div>
      <div id="typing-indicator"></div>
      <div class="send-message">
        <div class="emoji-picker-container">
          <button id="emoji-toggle" class="emoji-toggle" type="button" aria-label="Abrir emojis">
            😀
          </button>
          <div id="emoji-picker" class="emoji-picker" hidden></div>
        </div>
        <input type="text" id="message" />
        <button id="send-message" class="btn secondary">Enviar</button>
      </div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
